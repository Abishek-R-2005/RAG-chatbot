<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusAI Assistant</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    background:#070b24;
    color:white;
    overflow:hidden;
}

/* Sidebar */
.sidebar{
    width:300px;
    background:#0b1030;
    padding:20px;
    border-right:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:28px;
    margin-bottom:30px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

.new-chat{
    background:linear-gradient(90deg,#6a5cff,#4c3dff);
    padding:14px;
    border:none;
    border-radius:14px;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-bottom:30px;
}

.section-title{
    color:#7a80b8;
    font-size:13px;
    margin-bottom:12px;
    text-transform:uppercase;
}

.info-card{
    background:#13193d;
    padding:18px;
    border-radius:14px;
    margin-bottom:12px;
}

.info-card h3{
    font-size:18px;
}

.info-card p{
    font-size:13px;
    color:#8e94c8;
    margin-top:4px;
}

.try-list button{
    width:100%;
    background:#13193d;
    color:#d6dcff;
    border:none;
    padding:14px;
    border-radius:12px;
    text-align:left;
    margin-bottom:10px;
    cursor:pointer;
}

/* Main */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    background:radial-gradient(circle at center,#10173f,#070b24);
}

.header{
    padding:20px 30px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    font-size:22px;
    font-weight:bold;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.welcome{
    text-align:center;
    margin-top:60px;
}

.welcome .icon{
    font-size:70px;
    margin-bottom:20px;
}

.welcome h1{
    font-size:42px;
    margin-bottom:15px;
}

.welcome p{
    color:#9ea7db;
    max-width:700px;
    margin:auto;
    line-height:1.7;
}

.suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    margin-top:35px;
}

.suggestions button{
    background:#151c46;
    border:1px solid rgba(255,255,255,0.05);
    color:#d9ddff;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
}

.message{
    max-width:75%;
    padding:16px 20px;
    border-radius:18px;
    margin-bottom:20px;
    line-height:1.6;
}

.user{
    margin-left:auto;
    background:#4f46e5;
}

.bot{
    background:#151c46;
}

.input-area{
    padding:20px 30px;
    border-top:1px solid rgba(255,255,255,0.05);
}

.input-box{
    display:flex;
    background:#13193d;
    border-radius:18px;
    padding:10px;
}

.input-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
    padding:12px;
}

.input-box button{
    background:#5a4dff;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:14px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="logo">🧠 <span>CampusAI</span></div>

    <button class="new-chat" onclick="newChat()">+ New Chat</button>

    <div class="section-title">Dataset Info</div>

    <div class="info-card">
        <h3>300</h3>
        <p>Q&A Records</p>
    </div>

    <div class="info-card">
        <h3>TF-IDF</h3>
        <p>Vector Search</p>
    </div>

    <div class="info-card">
        <h3>Gemini</h3>
        <p>2.5 Flash</p>
    </div>

    <div class="section-title" style="margin-top:20px;">Try Asking</div>

    <div class="try-list">
        <button onclick="quickAsk(this)">What is the dress code?</button>
        <button onclick="quickAsk(this)">Is ID card mandatory?</button>
        <button onclick="quickAsk(this)">What facilities are available?</button>
        <button onclick="quickAsk(this)">How to register semester?</button>
    </div>
</div>

<div class="main">
    <div class="header">CampusAI Assistant</div>

    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcomeBox">
            <div class="icon">🧠</div>
            <h1>Welcome to CampusAI</h1>
            <p>
                I'm your intelligent college assistant. Ask me anything about rules,
                departments, facilities, or student services.
            </p>

            <div class="suggestions">
                <button onclick="quickAsk(this)">What is the dress code?</button>
                <button onclick="quickAsk(this)">Is mobile allowed?</button>
                <button onclick="quickAsk(this)">Lab coat compulsory?</button>
                <button onclick="quickAsk(this)">Semester rules?</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask anything...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const welcomeBox = document.getElementById("welcomeBox");

function newChat(){
    chatArea.innerHTML = welcomeBox.outerHTML;
}

function addMessage(text, sender){
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.innerText = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function quickAsk(btn){
    userInput.value = btn.innerText;
    sendMessage();
}

async function sendMessage(){
    const text = userInput.value.trim();
    if(!text) return;

    if(document.getElementById("welcomeBox")){
        document.getElementById("welcomeBox").remove();
    }

    addMessage(text,"user");
    userInput.value="";

    const loading = document.createElement("div");
    loading.className="message bot";
    loading.innerText="Typing...";
    chatArea.appendChild(loading);

    try{
        const response = await fetch("http://127.0.0.1:8000/query",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({question:text})
        });

        const data = await response.json();
        loading.remove();
        addMessage(data.answer,"bot");

    }catch(error){
        loading.remove();
        addMessage("Backend connection failed.","bot");
    }
}

userInput.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});
</script>

</body>
</html>
